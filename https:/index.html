<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16-maktab</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    padding: 15px;
    background: white;
    font-weight: bold;
    font-size: 18px;
}

/* Hero */
.hero {
    background: linear-gradient(135deg, #4f46e5, #9333ea);
    color: white;
    padding: 30px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 28px;
}

.hero p {
    margin-top: 10px;
}

/* Buttons */
.btn {
    display: block;
    width: 90%;
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

.btn-primary {
    background: white;
    color: #4f46e5;
}

.btn-yellow {
    background: #facc15;
}

/* Classes */
.classes {
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.card {
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
}

/* Quiz */
.quiz {
    display: none;
    padding: 20px;
}

.option {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.correct {
    border-color: green;
    background: #dcfce7;
}
</style>
</head>

<body>

<div class="header">
🎓 16-maktab | Tursunboyev Qahramon
</div>

<div class="hero">
<h1>Bilim olishning eng qiziqarli yo‘li</h1>
<p>Maktab o‘quvchilari uchun bilim platformasi</p>

<button class="btn btn-primary" onclick="showClasses()">Darslarni boshlash</button>
<button class="btn btn-yellow" onclick="startQuiz()">Test yechish</button>
</div>

<div class="classes" id="classes" style="display:none;">
<h2>Barcha darslar</h2>
<div class="grid">
<div class="card">4-sinf</div>
<div class="card">5-sinf</div>
<div class="card">6-sinf</div>
<div class="card">7-sinf</div>
<div class="card">8-sinf</div>
<div class="card">9-sinf</div>
<div class="card">10-sinf</div>
<div class="card">11-sinf</div>
</div>
</div>

<div class="quiz" id="quiz">
<h3>Eng yengil element qaysi?</h3>

<div class="option" onclick="check(this, true)">Vodorod</div>
<div class="option" onclick="check(this, false)">Geliy</div>
<div class="option" onclick="check(this, false)">Kislorod</div>

<button class="btn btn-primary" onclick="next()">Keyingi savol</button>
<p id="score">Ball: 0</p>
</div>

<script>
let score = 0;

function showClasses(){
    document.getElementById("classes").style.display = "block";
    document.getElementById("quiz").style.display = "none";
}

function startQuiz(){
    document.getElementById("quiz").style.display = "block";
    document.getElementById("classes").style.display = "none";
}

function check(el, correct){
    if(correct){
        el.classList.add("correct");
        score++;
        document.getElementById("score").innerText = "Ball: " + score;
    }
}

function next(){
    alert("Keyingi savolni qo‘shish kerak 🙂");
}
</script>

</body>
</html>
